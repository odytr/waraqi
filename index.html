<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>ورقي — Waraqi</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>ورقي</h1>
      <input id="search" type="search" data-i18n-ph="searchPlaceholder" />
      <select id="lang">
        <option value="ara+eng" data-i18n="langBoth"></option>
        <option value="ara" data-i18n="langAra"></option>
        <option value="eng" data-i18n="langEng"></option>
      </select>
      <button id="import" data-i18n="import"></button>
      <button id="export" class="ghost" data-i18n="exportArchive"></button>
      <button id="ui-lang" class="ghost">EN</button>
      <button id="theme" class="ghost" title="Dark mode">☾</button>
    </header>

    <div id="progress" hidden>
      <span id="progress-label"></span>
      <div class="bar"><div id="progress-fill"></div></div>
      <button id="cancel" class="ghost" data-i18n="cancel"></button>
    </div>

    <main id="grid"></main>
    <p id="empty" class="empty" data-i18n="empty"></p>

    <div id="viewer" hidden></div>
  </body>
</html>
